# MySQL 연결 정보 설정 (포트번호 3306 뒤의 todo_db는 데이터베이스 이름입니다)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/todo_db?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

# JPA 및 하이버네이트 설정 (콘솔창에 SQL문을 예쁘게 보여주는 옵션)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 서버 실행 시 JPA가 자동으로 MySQL에 테이블을 생성해 주는 옵션
spring.jpa.hibernate.ddl-auto=update

# JWT 설정 (비밀키는 보안을 위해 최소 32글자 이상의 긴 문자열을 입력해야 합니다)
jwt.secret=yourCustomSecretKeyMustBeVeryLongAndSecure1234567890
# 토큰 만료 시간 (예: 1시간 = 3600000 밀리초)
jwt.expiration-period=3600000
